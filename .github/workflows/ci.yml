name: ci

# 这条流水线的存在理由：**默认情况下没有任何东西会强制跑测试**。
# 审计时确认本仓此前只有 pytest 一道网，而且连「改完记得跑一遍」都是口头约定。
# 门槛刻意保持窄：ruff（E9/F/I）+ 全量 pytest。
# 不加 build/typecheck/前端构建 —— 那些在本地都还没成型，写成红灯只会诱导
# 后续人直接 disable 整条流水线。
#
# 注意：本机没有 git remote，所以这个文件目前**从未真正执行过**。
# 推到 GitHub 之前，请把它当作「期望的门禁」而不是「已在把守的门禁」。
# 本地等价命令（现在就能跑）：
#   python3 -m ruff check rag tools tests && python3 -m pytest -q

on:
  push:
    # 两条都写：本仓的分支历史上是 master，而 GitHub 新仓库的默认名常是 main。
    # 只写 main 的后果是「CI 文件存在但从不触发」——那比没有 CI 更坏，
    # 因为它看起来像有门禁。（第一次推之前就是这样，已修。）
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 与 pyproject 的 requires-python 一致；3.11+ 会让 tomllib 替代
          # tomli 这条兼容路径变成死代码，所以按最低支持版本跑更有检出力
          python-version: "3.10"
          cache: pip

      - name: 安装依赖
        # 只装最小集：docling/unstructured/local-models 是可选 extras，
        # 装上会让 CI 变成几分钟的下载而测不到任何东西
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff

      - name: 静态检查（ruff E9/F/I）
        run: ruff check rag tools tests

      - name: 测试
        # -q：这台 CI 上不需要逐条用例名；-m "not perf" 由 pyproject 的
        # addopts 之外的默认行为保证（perf 只在手动 -m perf 时跑）
        run: pytest -q

  frontend:
    # 前端产物新鲜度守卫（test_frontend_wiring.py）需要 web/dist 才能跑；
    # dist 不入库，所以这一步先构建，否则那批守卫会整批 skip 而看起来像通过。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: .
      - run: npm run build
        working-directory: .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
        name: 安装 Python 依赖
      - run: pytest -q tests/test_frontend_wiring.py
