name: ci

# 这条流水线的存在理由：**默认情况下没有任何东西会强制跑测试**。
# 审计时确认本仓此前只有 pytest 一道网，而且连「改完记得跑一遍」都是口头约定。
# 门槛刻意保持窄：ruff（E9/F/I）+ 全量 pytest。
# 不加 build/typecheck/前端构建 —— 那些在本地都还没成型，写成红灯只会诱导
# 后续人直接 disable 整条流水线。
#
# 注意：本机没有 git remote，所以这个文件目前**从未真正执行过**。
# 推到 GitHub 之前，请把它当作「期望的门禁」而不是「已在把守的门禁」。
# 本地等价命令（现在就能跑）：
#   python3 -m ruff check rag tools tests && python3 -m pytest -q

on:
  push:
    # 分支统一为 main（历史上叫 master，2026-10-06 改名）。
    # 这里只留 main：master 分支会在默认分支切换后删掉。
    # 曾经只写 main 而仓库还是 master，结果是「CI 文件存在但从不触发」——
    # 那比没有 CI 更危险，因为它看起来像有门禁。
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 与 pyproject 的 requires-python 一致；3.11+ 会让 tomllib 替代
          # tomli 这条兼容路径变成死代码，所以按最低支持版本跑更有检出力
          python-version: "3.10"
          cache: pip

      - name: 安装依赖
        # 只装最小集：docling/unstructured/local-models 是可选 extras，
        # 装上会让 CI 变成几分钟的下载而测不到任何东西
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff

      - name: 静态检查（ruff E9/F/I）
        run: ruff check rag tools tests

      - name: 测试
        id: pytest
        # -rf：结束时列出失败用例名。配合下面那步把结果写进 job summary，
        # 失败原因就变成**公开可见**的信息——Actions 日志本身要登录才能读，
        # 一个只能靠人肉开浏览器看日志的门禁，等于没有门禁。
        #
        # `set -o pipefail` 是这条步骤能不能当门禁用的关键：
        # GitHub 默认 shell 是 `bash -e`，**不带 pipefail**，
        # 于是 `pytest … | tee …` 的退出码来自 tee（永远 0）——
        # 测试全红流水线也全绿。写管道却不加 pipefail 的门禁是假门禁。
        shell: bash
        run: |
          set -o pipefail
          pytest -q --tb=short -rf 2>&1 | tee /tmp/pytest.log

      - name: 失败时把结果写进 job summary
        if: failure()
        run: |
          {
            echo "### pytest 失败摘要"
            echo '```'
            tail -n 80 /tmp/pytest.log
            echo '```'
            echo
            echo "### 本次解析到的关键版本（与开发机不同就会表现不同）"
            echo '```'
            python -m pip list 2>/dev/null | grep -iE "^(lancedb|pylance|lance|pyarrow|fastapi|starlette|pydantic|langchain|numpy|pandas|pymupdf|uvicorn|httpx|orjson|jieba) " || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    # 前端产物新鲜度守卫（test_frontend_wiring.py）需要 web/dist 才能跑；
    # dist 不入库，所以这一步先构建，否则那批守卫会整批 skip 而看起来像通过。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: .
      - run: npm run build
        working-directory: .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
        name: 安装 Python 依赖
      - run: pytest -q tests/test_frontend_wiring.py
