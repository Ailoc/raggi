<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Raggi — 本地知识检索</title>
    <meta name="description" content="本地部署的检索增强系统：多引擎解析入库、混合检索、分块编辑。" />
    <!-- 内联 data: 图标：避免浏览器请求 /favicon.ico 得到 404（控制台噪声，
         也会让 E2E 的“无错误”断言失败）；CSP 的 img-src 允许 data:。 -->
    <link rel="icon" href="data:," />
    <!-- 主题在首帧前决定：MUI 的 palette.mode 与浏览器 UI（滚动条/表单控件）
         都读这里，避免浅色用户先看到一帧深色。底色一并写上，防首帧白闪。
         独立文件（而非内联脚本）是为了能启用 script-src 'self' 的 CSP。 -->
    <script src="./theme-boot.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主内容</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
