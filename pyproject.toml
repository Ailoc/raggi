[project]
name = "raggi"
version = "0.1.0"
description = "极简单机 RAG：LangChain 编排 + LanceDB 存储，检索/解析/查看/模型可配"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "tomli>=2.0",           # 3.10 读取 config.toml（3.11+ 用 tomllib）
    "orjson>=3.10",
    "lancedb>=0.39,<0.40",
    "pylance>=0.20",            # LanceDB 原生引擎：索引/optimize/cleanup_old_versions 必需
    "pyarrow>=16",
    "langchain>=1.0",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-openai>=0.2",
    "langchain-ollama>=0.2",
    "pymupdf4llm>=1.0",
    "jieba>=0.42",
    "python-multipart>=0.0.9",  # 文件上传表单
    "pandas>=2.0",              # LanceDB to_pandas 依赖
]

[project.optional-dependencies]
docling = ["langchain-docling>=0.2", "docling>=2.0"]
unstructured = ["langchain-unstructured>=0.1", "unstructured>=0.14"]
local-models = ["langchain-huggingface>=0.1", "sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
# perf 标记默认不跑：这些门槛在 4 核 + 桌面常驻的开发机上抖动很大，
# 放进默认套件只会得到假红（结构性门槛留在默认套件里，见 test_perf_gates.py）。
markers = [
    "perf: 延迟/吞吐门槛（需要 rag-bench 的服务与合成数据集，手动跑）",
]

[project.scripts]
rag = "rag.server:main"
rag-bench = "tools.bench.__main__:main"

# flat-layout 下显式声明包范围，避免 web/ data/ 被误当作待安装顶层包。
# 前端 web/ 不进 Python 包：仅由 FastAPI 的 StaticFiles 托管。
[tool.setuptools.packages.find]
include = ["rag*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
