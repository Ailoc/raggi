[project]
name = "raggi"
version = "0.1.0"
description = "极简单机 RAG：LangChain 编排 + LanceDB 存储，检索/解析/查看/模型可配"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "tomli>=2.0",           # 3.10 读取 config.toml（3.11+ 用 tomllib）
    "orjson>=3.10",
    "lancedb>=0.39,<0.40",
    "pylance>=0.20",            # LanceDB 原生引擎：索引/optimize/cleanup_old_versions 必需
    "pyarrow>=16",
    "langchain>=1.0",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-openai>=0.2",
    "langchain-ollama>=0.2",
    "pymupdf4llm>=1.0",
    "jieba>=0.42",
    "python-multipart>=0.0.9",  # 文件上传表单
    "pandas>=2.0",              # LanceDB to_pandas 依赖
]

[project.optional-dependencies]
docling = ["langchain-docling>=0.2", "docling>=2.0"]
unstructured = ["langchain-unstructured>=0.1", "unstructured>=0.14"]
local-models = ["langchain-huggingface>=0.1", "sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6", "mypy>=1.8"]

[tool.pytest.ini_options]
# perf 标记默认不跑：这些门槛在 4 核 + 桌面常驻的开发机上抖动很大，
# 放进默认套件只会得到假红（结构性门槛留在默认套件里，见 test_perf_gates.py）。
#
# 光写 `markers = [...]` **不会**让它不跑——那只是声明哪些标记名合法，
# 真正的排除必须靠 addopts。所以这条注释描述的behavior此前并不存在：
# `pytest -q` 的收集结果里一直包含 `test_latency_budgets`（p50 < 150ms 这种
# 绝对延迟断言），而它自己的 docstring 写着「只在 pytest -m perf 下跑」。
# 属于「注释说 X、实现是 Y」这一类，只是本地机器够快一直没炸。
#
# 手动跑延迟门槛：`pytest -m perf`（命令行最后的 -m 覆盖这里的 addopts）。
addopts = ["-m", "not perf"]
markers = [
    "perf: 延迟/吞吐门槛（需要 rag-bench 的服务与合成数据集，手动跑）",
]

# 静态检查的起步规则集，按「每条都要能兑现」的原则选：
# - E9  语法错误与未定义名，这些是**真会炸**的；
# - F   pyflakes：未使用/未导入即使用、f-string 缺占位符、重复定义；
# - I   isort：导入分组与次序。
#
# **开 I 之前实测过它的风险**：本仓有 4 对真循环依赖
# （docs/ARCH-AUDIT-2026-10-06.md §1.3），靠函数内 import 维持，
# 而导入**次序**在这类模块里不是纯风格问题 —— 排一次就可能换一个模块先初始化。
# 验证方式：`pkgutil.walk_packages` 把 rag.* 全量导入一遍（正序与逆序各一次，
# 循环导入往往只在特定次序下暴露）⇒ 0 失败；再跑全量套件 ⇒ 544 passed。
# 今后若动到 storage 的导入，重跑那个双向导入探针即可。
#
# **刻意没有开** `RUF*`/`SIM`/`ANN`/`B`/`E501`：第一次跑就红 200 条的规则集
# 只会被长期 `--ignore`，等于没有；E501 另有一层原因 ——现存 39 行超 80，
# 设成 80 会得到一次「全文件重排」的假改动提交，那正是审查最想避免的噪声。
[tool.ruff]
line-length = 100
target-version = "py310"
# web/ 是 Svelte/TS，data/ 是运行时数据，都不该进 Python 检查范围
extend-exclude = ["web", "data", "build", "dist"]

[tool.ruff.lint]
select = ["E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# 测试里「只导入不使用」有真实用途的两种：注册型副作用导入、
# 以及只为拿到异常类。按文件放开比全局关 F401 好，
# 因为生产代码里的 F401 基本都是忘删的残留。
"tests/conftest.py" = ["F401"]

[project.scripts]
rag = "rag.server:main"
rag-bench = "tools.bench.__main__:main"

# flat-layout 下显式声明包范围，避免 web/ data/ 被误当作顶层包。
# 前端 web/ 不进 Python 包：仅由 FastAPI 的 StaticFiles 托管。
#
# `tools*` 必须在里面：`rag-bench` 是声明过的控制台脚本
# （`rag-bench = "tools.bench.__main__:main"`），而只装 rag* 的 wheel 里
# 根本没有 tools/ —— 实测装出来的 `rag-bench` 直接
# `ModuleNotFoundError: No module named 'tools'`。
# `pip install -e .` 恰好能跑（源码目录本身在 sys.path 上），
# 所以这个缺陷只有真装一次才看得见 —— 与 §2.4 的 `.gitignore` 是同一课。
[tool.setuptools.packages.find]
include = ["rag*", "tools*"]

# mypy 从 `rag/storage/` 起步（审计 M2 的第 ③ 项）。
#
# **为什么先只圈这一个目录**：存储层是本仓全部「隐式协议」事故的发生地
# （无鉴权、8 篇说 7 篇、迁移丢正文、假闸门、修复计数写错引擎 —— 五起都在这里），
# 而它同时也是最靠「约定」而非「类型」维持的一层：dict 到处当行用、
# 值可能是 str 也可能已经是 int、Optional 一路 `.get()`。
# 实测首轮 11 条报错里没有一条是纯噪音：3 条是 dict 值类型被推断错（会掩盖
# 真实赋值错误）、2 条是同一个变量在两种引擎方言间复用（含义都不同）、
# 1 条 `bool(row) and row.get(...)` 根本无法收窄、其余是运行时参数化的注解。
#
# **刻意不做什么**：不开 `strict`。第一次就红 200 条的检查器只会被长期
# `--ignore`，等于没有（同 ruff 的规则集决定）。也不假装全仓已覆盖 ——
# `files` 就是范围，扩大它需要一次目录一次目录地做。
[tool.mypy]
files = ["rag/storage"]
python_version = "3.10"
# lancedb / pyarrow / pydantic v1 兼容层都没有可靠的类型信息，
# 缺 stub 是既成事实；报 import-untyped 只会淹没真错误。
ignore_missing_imports = true
# 未标注的函数默认不检查（否则第一年的收益全是「缺少注解」的噪声）。
disallow_untyped_defs = false
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
